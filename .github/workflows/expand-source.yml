name: Expand source package

on:
  push:
    paths:
      - '.bootstrap/webcrawler-source-part-1.b64'
      - '.bootstrap/webcrawler-source-part-2.b64'

permissions:
  contents: write

jobs:
  expand:
    if: ${{ hashFiles('.bootstrap/webcrawler-source-part-1.b64', '.bootstrap/webcrawler-source-part-2.b64') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Expand plain source files
        shell: bash
        run: |
          if [[ ! -f .bootstrap/webcrawler-source-part-1.b64 || ! -f .bootstrap/webcrawler-source-part-2.b64 ]]; then
            echo "Waiting for both source package chunks."
            exit 0
          fi
          cat .bootstrap/webcrawler-source-part-1.b64 .bootstrap/webcrawler-source-part-2.b64 | base64 --decode | tar -xJf -
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add WebCrawler 0.1.1 source files"
          git push
